name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Check
        shell: powershell
        run: |
          $lua = Join-Path $env:GITHUB_WORKSPACE ".lua/bin/lua.exe"
          $luac = Join-Path $env:GITHUB_WORKSPACE ".lua/bin/luac.exe"
          if (-not (Test-Path $lua)) { $lua = (Get-Command lua).Source }
          if (-not (Test-Path $luac)) { $luac = (Get-Command luac).Source }
          & powershell -NoProfile -File scripts/check.ps1 -SkipProvenance -Lua $lua -Luac $luac
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build zip
        shell: powershell
        run: |
          & powershell -NoProfile -File scripts/build-zip.ps1 -PlacesFile data/Clairvoyance_places.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: Clairvoyance
          path: dist/Clairvoyance.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches modinfo.ini
        shell: powershell
        run: |
          $line = Get-Content modinfo.ini | Where-Object { $_ -match '^version=' } | Select-Object -First 1
          $ver = ($line -replace '^version=', '').Trim()
          if ("v$ver" -ne $env:GITHUB_REF_NAME) {
            Write-Host "tag $env:GITHUB_REF_NAME does not equal v$ver from modinfo.ini"
            exit 1
          }

      - uses: actions/download-artifact@v8
        with:
          name: Clairvoyance
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/Clairvoyance.zip
