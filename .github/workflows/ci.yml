name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.4"

      - name: Install zstandard
        shell: powershell
        run: |
          python -m pip install zstandard
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check
        shell: powershell
        run: |
          $lua = Join-Path $env:GITHUB_WORKSPACE ".lua/bin/lua.exe"
          $luac = Join-Path $env:GITHUB_WORKSPACE ".lua/bin/luac.exe"
          if (-not (Test-Path $lua)) { $lua = (Get-Command lua).Source }
          if (-not (Test-Path $luac)) { $luac = (Get-Command luac).Source }
          & powershell -NoProfile -File scripts/check.ps1 -SkipProvenance -Lua $lua -Luac $luac
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Commit subjects follow Conventional Commits
        if: github.event_name == 'pull_request'
        shell: powershell
        run: |
          python scripts/next_version.py check --range "origin/$env:GITHUB_BASE_REF..HEAD"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build zip
        shell: powershell
        run: |
          & powershell -NoProfile -File scripts/build-zip.ps1 -PlacesFile data/Clairvoyance_places.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: Clairvoyance
          path: dist/Clairvoyance.zip

  release:
    # Push to master: tag and publish v<next> when the commits since the last tag call for one.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version and notes
        id: ver
        shell: powershell
        run: |
          $v = (python scripts/next_version.py next | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit 1 }
          "version=$v" | Out-File -Append -Encoding ascii $env:GITHUB_OUTPUT
          if ($v -ne "") {
            python scripts/next_version.py notes | Out-File -Encoding utf8 release_notes.md
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            Write-Host "no release due"
          }

      - name: Build release zip
        if: steps.ver.outputs.version != ''
        shell: powershell
        run: |
          & powershell -NoProfile -File scripts/build-zip.ps1 -PlacesFile data/Clairvoyance_places.json -Version "${{ steps.ver.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: softprops/action-gh-release@v3
        if: steps.ver.outputs.version != ''
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: dist/Clairvoyance.zip

  release-tag:
    # Hand-made v* tag: build with the version taken from the tag.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build release zip
        shell: powershell
        run: |
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          & powershell -NoProfile -File scripts/build-zip.ps1 -PlacesFile data/Clairvoyance_places.json -Version $ver
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/Clairvoyance.zip
